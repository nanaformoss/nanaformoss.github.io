name: Steam Workshop Auto Sync

on:
  schedule:
    # 每天台灣時間早上 8 點自動同步 (UTC 0點)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊按鈕執行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Update Script
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node update.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add index.html
          # 如果檔案有變動就 commit，沒變動就跳過
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update steam stats" && git push)
